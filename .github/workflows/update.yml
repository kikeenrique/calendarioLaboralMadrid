name: Update Madrid Calendar Feeds

on:
  schedule:
    - cron: "0 0 1,15 * *"
  workflow_dispatch:

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          # Pinned so CI does not silently move toolchain. The package declares
          # swift-tools-version 6.0 and the tests use Swift Testing, which needs 6.x.
          swift-version: "6.0"

      # Before generating anything: a broken parser must not publish a truncated
      # feed to subscribers.
      - name: Run tests
        run: swift test

      # The two feeds are independent: a failure in one must not discard the
      # other's refresh, so each runs in its own step and the commit step runs
      # regardless. A failed step still fails the job, keeping the breakage
      # visible.
      - name: Build holiday feed
        id: holidays
        run: swift run GenerateHolidayFeed

      # Reads the archived page; does no networking. See the note at the top of
      # Sources/SchoolCalendar/SchoolCalendar.swift.
      - name: Build school calendar feed
        id: school
        if: always()
        run: swift run GenerateSchoolFeed

      - name: Commit and push
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/madrid-festivos.ics docs/calendario-escolar-comunidad-madrid.ics
          git diff --cached --quiet || git commit -m "Auto-update calendar feeds"
          git push

      - name: Report generator outcomes
        if: always()
        run: |
          echo "holiday feed: ${{ steps.holidays.outcome }}"
          echo "school feed:  ${{ steps.school.outcome }}"
