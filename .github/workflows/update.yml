name: Update Madrid Calendar Feeds

on:
  schedule:
    - cron: "0 0 1,15 * *"
  workflow_dispatch:

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Official Swift image rather than a setup action: it pins the toolchain, so
    # the build is reproducible and the SPM cache below stays valid. It also
    # avoids swift-actions/setup-swift, which declares node20 in every released
    # version including the v3 beta, and GitHub removes node20 from runners on
    # 2026-09-23.
    container: swift:6.3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      # There are no external dependencies, so nothing to resolve - the cache is
      # purely compiled output. The key covers everything that affects it; the
      # restore-keys prefix lets an older cache seed an incremental rebuild when
      # only some sources changed.
      - name: Restore SPM build cache
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-swift6.3-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: spm-swift6.3-

      # Before generating anything: a broken parser must not publish a truncated
      # feed to subscribers.
      - name: Run tests
        run: swift test

      # The two feeds are independent: a failure in one must not discard the
      # other's refresh, so each runs in its own step and the commit step runs
      # regardless. A failed step still fails the job, keeping the breakage
      # visible.
      - name: Build holiday feed
        id: holidays
        run: swift run GenerateHolidayFeed

      # Reads the archived page; does no networking. See documentation/SOURCES.md.
      - name: Build school calendar feed
        id: school
        if: always()
        run: swift run GenerateSchoolFeed

      - name: Commit and push
        if: always()
        run: |
          # The container runs as a different user than the checkout, so git
          # refuses the working tree without this.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/madrid-festivos.ics docs/calendario-escolar-comunidad-madrid.ics
          git diff --cached --quiet || git commit -m "Auto-update calendar feeds"
          git push

      - name: Report generator outcomes
        if: always()
        run: |
          echo "holiday feed: ${{ steps.holidays.outcome }}"
          echo "school feed:  ${{ steps.school.outcome }}"
