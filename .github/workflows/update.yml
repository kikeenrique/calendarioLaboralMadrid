name: Update Madrid Calendar Feeds

on:
  schedule:
    - cron: "0 0 1,15 * *"
  workflow_dispatch:

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Swift comes preinstalled on the runner image, so no setup action is
      # needed. swift-actions/setup-swift was dropped because every released
      # version - including the v3 beta - still declares node20, which GitHub
      # removes from runners on 2026-09-23.
      #
      # This means the toolchain follows the runner image rather than a pin. That
      # is acceptable here: Package.swift only requires tools 6.0, and the tests
      # below run before anything is generated, so a toolchain change shows up as
      # a test failure rather than a bad published feed. The version is logged on
      # every run so it is always clear what built the feeds.
      - name: Show Swift version
        run: swift --version

      # Before generating anything: a broken parser must not publish a truncated
      # feed to subscribers.
      - name: Run tests
        run: swift test

      # The two feeds are independent: a failure in one must not discard the
      # other's refresh, so each runs in its own step and the commit step runs
      # regardless. A failed step still fails the job, keeping the breakage
      # visible.
      - name: Build holiday feed
        id: holidays
        run: swift run GenerateHolidayFeed

      # Reads the archived page; does no networking. See the note at the top of
      # Sources/SchoolCalendar/SchoolCalendar.swift.
      - name: Build school calendar feed
        id: school
        if: always()
        run: swift run GenerateSchoolFeed

      - name: Commit and push
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/madrid-festivos.ics docs/calendario-escolar-comunidad-madrid.ics
          git diff --cached --quiet || git commit -m "Auto-update calendar feeds"
          git push

      - name: Report generator outcomes
        if: always()
        run: |
          echo "holiday feed: ${{ steps.holidays.outcome }}"
          echo "school feed:  ${{ steps.school.outcome }}"
