name: Update Madrid Holidays Feed

on:
  schedule:
    - cron: "0 0 1,15 * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2

      - name: Run Build Script
        run: swift src/main.swift

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/madrid-festivos.ics
          git diff --cached --quiet || git commit -m "Auto-update holidays feed"
          git push
